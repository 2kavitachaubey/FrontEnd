<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="main">
      <!-- <nav></nav> -->

      <section class="feature-grid">
        <div class="todo feature-card" id="0">
          <img
            src="https://images.unsplash.com/photo-1578852612716-854e527abf2e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fHRvJTIwZG98ZW58MHx8MHx8fDA%3D"
            alt=""
          />
          <h2>To Do List</h2>
        </div>
        <div class="daily feature-card" id="1">
          <img
            src="https://images.unsplash.com/photo-1579017308347-e53e0d2fc5e9?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8cGxhbm5lcnxlbnwwfHwwfHx8MA%3D%3D"
            alt=""
          />
          <h2>Daily Planner</h2>
        </div>
        <div class="moti feature-card" id="2">
          <img
            src="https://images.unsplash.com/photo-1528716321680-815a8cdb8cbe?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bW90aXZhdGlvbnxlbnwwfHwwfHx8MA%3D%3D"
            alt=""
          />
          <h2>Motivation</h2>
        </div>
        <div class="pomo feature-card" id="3">
          <img
            src="https://images.unsplash.com/photo-1641567926412-7a6158b8e81f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fHRpbWVyfGVufDB8fDB8fHww"
            alt=""
          />
          <h2>Pomodoro Timer</h2>
        </div>
        <div class="goals feature-card" id="4">
          <img
            src="https://images.unsplash.com/photo-1622042002773-a6f2913a6e84?q=80&w=794&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Daily Goals</h2>
        </div>
      </section>

      <section class="feature-page todo-fullPage">
        <button class="close-button" id="0"><i class="ri-close-line"></i></button>
        <h2>Your Personalised To Do List</h2>

        <div class="todo-container">
          <div class="task-form-panel">
            <form>
              <input type="text" placeholder="Enter Task" />
              <textarea placeholder="Enter Details" name="" id=""></textarea>
              <div class="mark-imp">
                <input type="checkbox" name="" id="check">
                <label for="check">Mark as Important</label>
              </div>
              <button>Add Task</button>
            </form>
          </div>
          <div class="task-list">
            <div class="task-item">
              <div class="task-content">
                <h5></h5>
                <details>
                  <summary></summary>
                  <p></p>
                </details>
              </div>
              <div class="task-actions">
                <button class="complete-task-button"></button>
                <button class="delete-task-button"></button>
              </div>
            </div>
            </div>
          </div>
        </div>
      </section>
      <section class="feature-page daily-planner-fullPage">
        <button class="close-button" id="1"><i class="ri-close-line"></i></button>
        <h1>Daily Planner</h1>
      </section>
      <section class="feature-page motivation-fullPage">
        <button class="close-button" id="2"><i class="ri-close-line"></i></button>
        <h1>Motivation</h1>
      </section>
      <section class="feature-page pomodoro-fullPage">
        <button class="close-button" id="3"><i class="ri-close-line"></i></button>
        <h1>Pomodoro Timer</h1>
      </section>
      <section class="feature-page daily-goals-fullPage">
        <button class="close-button" id="4"><i class="ri-close-line"></i></button>
        <h1>Daily Goals</h1>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
