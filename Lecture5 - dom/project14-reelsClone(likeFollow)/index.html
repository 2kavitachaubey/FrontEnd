<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section>
        <div class="reels">
          <div class="reel">
            <img src="https://picsum.photos/id/1015/350/700" alt="reel" />
            <div class="top">
              <h3>Reels</h3>
              <span
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                  ></path>
                  <circle cx="12" cy="13" r="4"></circle></svg
              ></span>
            </div>
            <div class="actions">
              <div class="action">
                <i class="ri-heart-line"></i>
                <h6>1.2k</h6>
              </div>
              <div class="action">
                <span
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L21 21Z"
                    ></path></svg
                ></span>
                <h6>320</h6>
              </div>
              <div class="action">
                <span
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg
                ></span>
                <h6>150</h6>
              </div>
              <div class="action">
                <span
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"
                    ></path></svg
                ></span>
              </div>
              <div class="action">
                <span
                  ><svg viewBox="0 0 24 24" fill="white">
                    <circle cx="12" cy="5" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="19" r="1.5"></circle></svg
                ></span>
              </div>
            </div>
            <div class="bottom">
              <div class="user">
                <img src="https://picsum.photos/id/64/50/50" alt="user" />
                <h4>Kavita</h4>
                <button>Follow</button>
              </div>
              <p class="caption">Living my best life ✨ #reels #instagram</p>
              <div class="audio">
                <span
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle></svg
                ></span>
                <p>Original audio - Kavita</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
